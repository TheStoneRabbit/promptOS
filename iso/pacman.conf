[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5

# Use curl for downloads so the slow pinned archive.archlinux.org mirror does
# not trigger pacman's built-in "Operation too slow" abort (<1 byte/sec for
# 10s). curl has no low-speed timeout by default and retries transient errors.
# (Setting XferCommand disables ParallelDownloads, which is fine here.)
XferCommand = /usr/bin/curl --fail --location --continue-at - --retry 5 --retry-delay 3 --connect-timeout 60 --output %o %u

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
