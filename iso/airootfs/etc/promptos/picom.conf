# promptOS picom compositor config.
# xrender backend so it works under emulation / without GPU acceleration.
# Provides real rounded corners + a soft shadow for the search-bar overlay.

backend = "xrender";
vsync = false;

# Rounded corners for all windows (the overlay reads as a floating rounded panel).
corner-radius = 18;

# Soft drop shadow for depth.
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.45;
shadow-offset-x = -22;
shadow-offset-y = -8;

# Gentle fade when the overlay is summoned/dismissed.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

detect-rounded-corners = true;
detect-client-opacity = true;
