MODULES=(squashfs iso9660 loop overlay)
BINARIES=()
FILES=()
# The 'archiso' hook (from mkinitcpio-archiso) is required for live ISO booting.
# It locates the ISO device, mounts the squashfs root, and performs switch_root.
# 'filesystems' is omitted — archiso handles root mounting; auto-detection fails in Docker.
# 'keyboard' and 'consolefont' are omitted to avoid missing vconsole.conf errors in the build env.
HOOKS=(base udev memdisk archiso block)
