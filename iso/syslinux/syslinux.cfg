UI vesamenu.c32
DEFAULT promptos
TIMEOUT 50

MENU TITLE promptOS — AI-Native Linux
MENU BACKGROUND splash.png
MENU RESOLUTION 1024 768

# Visual tweaks so the menu doesn't drown out the logo background.
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #ffffffff #00000000 std
MENU COLOR sel          7;37;40 #ff000000 #ffeeeeee all
MENU COLOR unsel        37;44   #ffaaaaaa #00000000 none
MENU COLOR help         37;40   #ffdddddd #00000000 none
MENU COLOR timeout_msg  37;40   #ffffffff #00000000 none
MENU COLOR timeout      1;37;40 #ffffffff #00000000 none
MENU MARGIN 16
MENU ROWS 4
MENU TABMSGROW 18
MENU TIMEOUTROW 20

LABEL promptos
    MENU LABEL promptOS - AI-Native Linux
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% cow_spacesize=1G
